name: Domain watch

on:
  # Primary trigger: external cron service (cron-job.org) hits the
  # repository_dispatch API every N minutes. GitHub's own scheduler is
  # unreliable for newly-created repos, so we keep schedule as a fallback
  # and rely on the external trigger for actual cadence.
  repository_dispatch:
    types: [poll]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Run sequentially — the workflow commits seen.json back, so concurrent runs
# would collide. New triggers queue and wait for the prior run to finish.
concurrency:
  group: domain-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python check.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKORDER_HMAC_SECRET: ${{ secrets.BACKORDER_HMAC_SECRET }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Commit updated seen.json
        run: |
          if git diff --quiet seen.json; then
            echo "No changes to seen.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update seen domains [skip ci]"
          git push
