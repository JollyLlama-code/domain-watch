name: Domain watch

on:
  schedule:
    # Every 30 min at :07 and :37 (off-peak minutes; round-hour crons get
    # skipped by GitHub during high-load windows). seen.json dedupes so
    # frequent polling doesn't cause duplicate notifications.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python check.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated seen.json
        run: |
          if git diff --quiet seen.json; then
            echo "No changes to seen.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update seen domains [skip ci]"
          git push
