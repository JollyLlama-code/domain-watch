name: Domain watch

on:
  schedule:
    # Every 5 min, shifted off the round :00/:05/:30 boundaries that GitHub's
    # scheduler is most likely to skip under load. 5 min is GitHub's documented
    # cron floor; sub-5-min isn't accepted. Requires the repo to be public for
    # unlimited GHA minutes — on private repos this would burn the 2000 min/mo.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python check.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated seen.json
        run: |
          if git diff --quiet seen.json; then
            echo "No changes to seen.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update seen domains [skip ci]"
          git push
